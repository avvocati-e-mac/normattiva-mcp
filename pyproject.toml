[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "normattiva-mcp"
version = "0.1.1"
description = "CLI e server MCP per leggere, verificare e citare norme italiane da Normattiva.it"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Filippo Strozzi" }]
dependencies = [
  "httpx>=0.28",
  "mcp>=1.13",
  "pydantic>=2.10",
  "rich>=13.9",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0", "ruff>=0.11"]

[project.scripts]
norm = "normattiva_mcp.cli:main"
norm-mcp = "normattiva_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/normattiva_mcp"]

[tool.hatch.build]
include = ["src/normattiva_mcp/**/*.py", "src/normattiva_mcp/data/**/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not live'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: esegue richieste reali contro Normattiva.it (opt-in, NORMATTIVA_LIVE_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]
